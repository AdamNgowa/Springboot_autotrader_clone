services:
  postgres:
    image: postgres:17
    container_name: autotrader-postgres

    environment:
      POSTGRES_DB: autotrader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    image: autotrader-backend:latest
    container_name: autotrader-backend

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: autotrader
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    ports:
      - "8080:8080"

    depends_on:
      - postgres

volumes:
  postgres-data: