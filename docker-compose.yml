services:
  postgres:
    image: postgres:17
    container_name: autotrader-postgres

    environment:
      POSTGRES_DB: autotrader
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend

    image: autotrader-backend:latest
    container_name: autotrader-backend

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: autotrader
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL_MODE: disable
      DB_CHANNEL_BINDING: prefer
      JWT_SECRET: ${JWT_SECRET}

    volumes:
      - uploads-data:/app/uploads

    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}

    image: autotrader-frontend:latest
    container_name: autotrader-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

volumes:
  postgres-data:
  uploads-data: