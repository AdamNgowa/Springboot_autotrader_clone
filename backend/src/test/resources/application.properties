# ============================================================
# TEST DATABASE - PostgreSQL via Testcontainers
# The datasource itself comes from TestcontainersConfiguration (@ServiceConnection).
# ============================================================

# Hibernate builds the schema from the entities on real PostgreSQL for every context.
# (Switches to validate once Flyway owns the schema in 12.10.)
spring.jpa.hibernate.ddl-auto=create-drop

# Show SQL while running tests
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Match production: no session kept open for the whole request, so lazy-loading bugs surface in tests.
spring.jpa.open-in-view=false


# ============================================================
# JWT TEST CONFIGURATION
# ============================================================

# Test-only secret - DO NOT use this as a production secret
jwt.secret=VGhpc0lzQVRlc3RTZWNyZXRLRXlGb3JBdXRvVHJhZGVyMjAyNg==

# 1 hour in milliseconds
jwt.expiration=3600000


# ============================================================
# SECURITY / CORS
# ============================================================

# This file shadows src/main/resources/application.properties during tests,
# so every property SecurityConfig needs must be repeated here.
app.cors.allowed-origin=http://localhost:5173


# ============================================================
# FILE STORAGE
# ============================================================

# Test uploads directory
app.upload.directory=build/test-uploads

# Same limits as production (needed by ImageUploadLimitIntegrationTest)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB


# ============================================================
# APPLICATION
# ============================================================

spring.application.name=backend
