# ============================================================
# TEST DATABASE - H2
# ============================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Recreate the database schema for every test run
spring.jpa.hibernate.ddl-auto=create-drop

# Show SQL while running tests
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ============================================================
# JWT TEST CONFIGURATION
# ============================================================

# Test-only secret - DO NOT use this as a production secret
jwt.secret=VGhpc0lzQVRlc3RTZWNyZXRLRXlGb3JBdXRvVHJhZGVyMjAyNg==

# 1 hour in milliseconds
jwt.expiration=3600000


# ============================================================
# FILE STORAGE
# ============================================================

# Test uploads directory
app.upload.directory=build/test-uploads


# ============================================================
# APPLICATION
# ============================================================

spring.application.name=backend