# ============================================================
# PRODUCTION PROFILE
# Activated with SPRING_PROFILES_ACTIVE=prod
# Loaded ON TOP of application.properties, overriding matching keys.
# Behavior lives here (committed). Secrets and hostnames stay in env vars.
# ============================================================

# Never echo SQL in production: noisy, slow, and can leak data into logs.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Hibernate may only VERIFY the schema, never alter it.
# Safe interim choice until Flyway takes over in 12.10.
spring.jpa.hibernate.ddl-auto=validate

# Don't keep a DB connection open for the whole HTTP request (see below).
spring.jpa.open-in-view=false

# ------------------------------------------------------------
# Logging (stdout only: Docker captures it, no file appenders)
# ------------------------------------------------------------
logging.level.root=INFO
logging.level.com.autotrader.backend=INFO

# Keep framework internals quiet. Never enable Hibernate bind/TRACE
# logging in production: it prints real parameter values.
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN