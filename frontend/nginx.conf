server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow larger uploads for vehicle images.
    client_max_body_size 10M;

    # All backend requests go through /api and are forwarded to Spring Boot.
    # The trailing slash on proxy_pass strips the /api prefix, so
    # /api/listings?page=0 becomes /listings?page=0 on the backend.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else belongs to the React SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}